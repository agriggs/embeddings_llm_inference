[project]
name = "embeddings-llm-inference"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.82.0",
    "chromadb>=1.5.0",
    "google-genai>=1.63.0",
    "more-itertools>=10.8.0",
    "openai>=2.21.0",
    "polars>=1.38.1",
    "sentence-transformers>=5.2.3",
    "torch>=2.7.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
